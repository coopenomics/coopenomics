# ============================================================================
# ОТКЛЮЧЁН 2026-08-22 (задача C28-45).
#
# Раньше здесь собирался сайт docs.coopenomics.world и публиковался на GitHub
# Pages. После объединения документации домен ведёт на docs.blago.coop (301),
# то есть публиковать стало некуда: сборка с doxygen, typedoc и Vue-реестром
# занимала единственный раннер впустую.
#
# Файл не удалён намеренно: релиз mono дёргает именно этот workflow по имени
# (release.yaml → publish-docs.yaml/dispatches), и на отсутствующем workflow
# шаг упал бы с 404, уронив релиз. Поэтому осталась одна задача — разбудить
# сборку объединённого сайта. Когда release.yaml в mono переключат на
# publish-blago-docs.yaml напрямую, этот файл можно удалить.
#
# История сборки старого сайта — в git до коммита, снявшего её.
# ============================================================================
name: Publish Coopenomics Website (legacy, only forwards to blago docs)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy_from_mono]

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: Разбудить сборку docs.blago.coop
        run: |
          curl -fsSL -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"master"}' \
            "https://git.coopenomics.world/api/v1/repos/C9S/coopenomics/actions/workflows/publish-blago-docs.yaml/dispatches"
          echo "✓ сборка docs.blago.coop запущена"
