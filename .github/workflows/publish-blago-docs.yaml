# ============================================================================
# Сборка объединённой документации «Благономика» → docs.blago.coop
#
# Собирает один сайт из двух репозиториев (этого и mono) скриптом
# newsite/build.sh и кладёт готовую статику в ветку pages-blago, откуда её
# забирает ansible-плейбук playbooks/docs/blago-setup.yaml.
#
# Генерируемые справочники (SDK, cooptypes, контракты, Chain API, реестр
# стандартов) собираются теми же шагами, что и в publish-docs.yaml, и
# ложатся в КОРЕНЬ сайта — там их ждут макросы, отдающие абсолютные пути.
#
# Две цели сборки — одни и те же шаги:
#   prod    → ветка pages-blago   → docs.blago.coop
#   preview → ветка preview-pages → docs-preview.blago.coop
# Превью собирается из ветки mono docs-preview: туда кладут документацию и
# стандарты на согласование до релиза. Каждые 15 минут работа plan сверяет
# коммит docs-preview с тем, из которого собрано превью, и пересобирает только
# при изменении. Немедленно — workflow_dispatch с target=preview.
# Имя ветки превью не содержит «pages-blago»: интеграция Semaphore боевого
# сайта срабатывает по вхождению этой строки в ref.
# ============================================================================
name: Publish Blago Docs

on:
  push:
    branches:
      - master
  # Документация живёт в двух репозиториях, и правки на стороне mono между
  # релизами иначе доехали бы только со следующим релизом. Ночная пересборка
  # подхватывает их сама; на стороне mono есть ещё и push-триггер по
  # components/docs, но он работает лишь в ветках, куда доехал его workflow.
  schedule:
    - cron: '17 2 * * *'      # ночная пересборка боевого сайта
    - cron: '*/15 * * * *'    # проверка ветки превью
  workflow_dispatch:
    inputs:
      target:
        description: "Куда собирать: prod (docs.blago.coop) или preview (docs-preview.blago.coop)"
        required: false
        default: "prod"
        type: choice
        options: [prod, preview]
      mono_ref:
        description: "Ветка mono, с которой берётся документация (пусто — по цели)"
        required: false
        default: ""
  repository_dispatch:
    types: [deploy_blago_docs]

jobs:
  # Решает, что собирать: цель, ветку mono и нужна ли сборка вообще.
  plan:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.plan.outputs.target }}
      mono_ref: ${{ steps.plan.outputs.mono_ref }}
      run: ${{ steps.plan.outputs.run }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_TARGET: ${{ github.event.inputs.target }}
          IN_REF: ${{ github.event.inputs.mono_ref }}
          # Ветка mono для боевого сайта живёт в переменной репозитория
          # MONO_DOCS_REF — чтобы переключать её правкой переменной, а не workflow.
          PROD_REF: ${{ vars.MONO_DOCS_REF || 'main' }}
        run: |
          target=prod
          if [ "$EVENT" = schedule ] && [ "$SCHEDULE" = '*/15 * * * *' ]; then target=preview; fi
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$IN_TARGET" ]; then target="$IN_TARGET"; fi
          if [ -n "$IN_REF" ]; then ref="$IN_REF"; elif [ "$target" = preview ]; then ref=docs-preview; else ref="$PROD_REF"; fi
          run=true
          # По расписанию превью собирается, только если ветка mono сдвинулась:
          # коммит, из которого собрано превью, записан в сообщении preview-pages.
          if [ "$EVENT" = schedule ] && [ "$target" = preview ]; then
            head=$(git ls-remote https://git.coopenomics.world/C9S/mono.git "refs/heads/$ref" | cut -f1)
            built=$(git ls-remote https://git.coopenomics.world/C9S/coopenomics.git refs/heads/preview-pages | cut -f1)
            if [ -z "$head" ]; then
              run=false
              echo "ветки $ref в mono нет — превью не собираем"
            elif [ -n "$built" ]; then
              git init -q probe && cd probe
              git fetch -q --depth 1 https://git.coopenomics.world/C9S/coopenomics.git preview-pages
              if git log -1 --format=%s FETCH_HEAD | grep -q "mono@$head"; then
                run=false
                echo "превью уже собрано из $ref@$head"
              fi
            fi
          fi
          echo "цель: $target, ветка mono: $ref, сборка: $run"
          {
            echo "target=$target"
            echo "mono_ref=$ref"
            echo "run=$run"
          } >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Две сборки одной цели не публикуют поверх друг друга.
    concurrency:
      group: blago-docs-${{ needs.plan.outputs.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ needs.plan.outputs.target }}
      MONO_REF: ${{ needs.plan.outputs.mono_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Clone mono
        run: |
          git clone https://git.coopenomics.world/C9S/mono.git mono-repo
          cd mono-repo
          REF="$MONO_REF"
          # auto: публикуем прод-срез, как только документация туда доедет.
          # Признак — каталог стола администратора: он появился при пересборке
          # раздела по четырём столам, а в старой структуре его нет. Пока main
          # держит документацию снятого UI, берём staging-срез.
          if [ "$REF" = "auto" ]; then
            if git cat-file -e origin/main:components/docs/docs/new/marketplace/admin 2>/dev/null; then
              REF=main
            else
              REF=testnet
              echo "⚠ в main ещё старая структура документации — публикуем testnet"
            fi
          fi
          echo "ветка документации: $REF"
          git checkout "$REF"
          echo "MONO_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Doxygen 1.9.3
        run: |
          curl -L "https://sourceforge.net/projects/doxygen/files/rel-1.9.3/doxygen-1.9.3.linux.bin.tar.gz/download" -o doxygen.tar.gz
          tar xzf doxygen.tar.gz
          sudo cp doxygen-1.9.3/bin/doxygen /usr/local/bin/

      - name: Install pnpm and redocly
        run: npm install -g pnpm @redocly/cli

      - name: Install Python requirements
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install mkdocs-material mkdocs-macros-plugin mkdocs-section-index \
                      mkdocs-monorepo-plugin pymdown-extensions

      - name: Generate contracts documentation (doxygen)
        run: cd mono-repo/components/contracts && doxygen

      # Ставим только нужные пакеты вместе с их workspace-зависимостями:
      # корневой install тянет ещё и desktop (quasar), который здесь не нужен.
      - name: Install mono workspace packages
        run: |
          cd mono-repo
          pnpm install --filter cooptypes... \
                       --filter @coopenomics/controller... \
                       --filter @coopenomics/sdk...

      - name: Generate cooptypes docs
        run: |
          cd mono-repo
          pnpm --filter cooptypes run build
          pnpm --filter cooptypes run docs

      # SDK-доки собираются из schema.gql: generate-index-comments вычитывает
      # оттуда описания методов. Схема не коммитится, поэтому генерируем её
      # здесь — скрипт code-first, без HTTP и без баз (CONTROLLER_SCHEMA_GEN=1).
      # Без этого шага падает и сборка старого сайта — проверено на прогоне 1652.
      - name: Generate GraphQL schema
        # Необязательный шаг: схема лишь дополняет описания методов SDK, а
        # комментарии в коде и так лежат в репозитории. Контроллер рабочих
        # веток компилируется не всегда (ошибки типов), а SWC спотыкается о
        # циклический импорт TypeORM-сущностей capital — документация из-за
        # этого стоять не должна.
        continue-on-error: true
        run: |
          cd mono-repo
          # Контроллер импортирует workspace-пакеты из их dist (extension-kit,
          # factory, innercoop, jurisdictions, notifications, sdk, cooptypes),
          # поэтому сперва собираем зависимости — синтаксис ^... берёт именно их,
          # без самого контроллера. Пакеты без скрипта build пропускаются.
          pnpm install --filter "@coopenomics/controller^..." --filter @coopenomics/controller
          pnpm --filter "@coopenomics/controller^..." run build
          # Схему строим через SWC, а не ts-node: он эмитит метаданные
          # декораторов (без них Nest падает с UndefinedTypeError на первом
          # @Field), но не проверяет типы — а контроллер в рабочих ветках
          # компилируется не всегда, и документация не должна на этом стоять.
          # @swc-node/register лежит в devDependencies контроллера ровно для
          # таких запусков. Первая попытка — штатный скрипт с swc-режимом
          # ts-node, запасная — прямой вызов через регистратор SWC.
          TS_NODE_SWC=true pnpm --filter @coopenomics/controller run generate-schema \
            || ( cd components/controller \
                 && node -r ./scripts/register-schema-gen-env.cjs \
                         -r @swc-node/register \
                         -r tsconfig-paths/register \
                         scripts/generate-schema.ts )

      - name: Generate SDK documentation
        run: |
          cd mono-repo
          pnpm --filter @coopenomics/sdk run build
          if [ -f components/controller/schema.gql ]; then
            pnpm --filter @coopenomics/sdk run docs
          else
            echo "⚠ schema.gql не собралась — typedoc без описаний из схемы"
            pnpm --filter @coopenomics/sdk exec typedoc
          fi

      - name: Generate node API documentation
        run: |
          for api in chain db_size net trace_api producer; do
            out="${api%_api}"
            mkdir -p "docs/api/$out"
            redocly build-docs "coopos/$api.swagger.yaml" --output "docs/api/$out/index.html" || true
          done

      # Redocly вшивает redoc.standalone.js с cdn.redocly.com — из РФ CDN таймаутит.
      - name: Self-host Redoc bundle
        run: |
          set -e
          VER=$(grep -hoE 'cdn\.redocly\.com/redoc/[^/]+' docs/api/*/index.html 2>/dev/null | head -1 | sed 's|.*/||')
          # jsdelivr временами отвечает 503 (15.10.2026 сборка упала здесь), поэтому
          # повторы, запасной CDN и номер версии без «v». Не скачалось — справочник
          # остаётся на cdn.redocly.com: это хуже для РФ, но не повод терять сайт.
          if [ -n "$VER" ]; then
            ok=0
            for v in "$VER" "${VER#v}"; do
              for src in "https://cdn.jsdelivr.net/npm/redoc@${v}/bundles/redoc.standalone.js" \
                         "https://unpkg.com/redoc@${v}/bundles/redoc.standalone.js"; do
                if curl -fsSL --retry 3 --retry-delay 5 "$src" -o docs/api/redoc.standalone.js; then
                  ok=1
                  break 2
                fi
              done
            done
            if [ "$ok" = 1 ]; then
              for f in docs/api/*/index.html; do
                sed -i 's|https://cdn\.redocly\.com/redoc/[^/]*/bundles/redoc\.standalone\.js|../redoc.standalone.js|g' "$f"
              done
            else
              rm -f docs/api/redoc.standalone.js
              echo "⚠ redoc ${VER} не скачался — справочник API ссылается на cdn.redocly.com"
            fi
          fi

      - name: Copy contracts and cooptypes docs
        run: |
          mkdir -p docs/contracts docs/cooptypes
          cp -r mono-repo/components/contracts/docs/html/. docs/contracts/
          if [ -d mono-repo/components/cooptypes/docs ]; then
            cp -r mono-repo/components/cooptypes/docs/. docs/cooptypes/
          else
            echo "⚠ доки cooptypes не собрались — справочник поедет пустым"
          fi

      - name: Build standards-site
        # Реестр стандартов — отдельный Vue-сайт; его штатный build это
        # «vue-tsc --noEmit && vite build», то есть ещё один typecheck чужого
        # кода. Документации нужен собранный dist, поэтому зовём vite напрямую.
        continue-on-error: true
        run: |
          if [ -d mono-repo/components/contracts/standards-site ]; then
            cd mono-repo/components/contracts/standards-site
            pnpm install
            pnpm exec vite build
            mkdir -p "$GITHUB_WORKSPACE/docs/standards"
            cp -r dist/. "$GITHUB_WORKSPACE/docs/standards/"
          else
            echo "⚠ standards-site отсутствует в ветке $MONO_REF — пропускаем"
          fi

      - name: Build site
        run: |
          source venv/bin/activate
          MONO_DIR="$GITHUB_WORKSPACE/mono-repo" OUT_DIR="$GITHUB_WORKSPACE/site" \
            DISABLE_MKDOCS_2_WARNING=true ./newsite/build.sh

      # Сборка идёт на GitHub-зеркале: Actions в Gitea выключены (15.10.2026),
      # раннеры переехали на GitHub. Токен GitHub для Gitea чужой, поэтому
      # публикует deploy key репозитория C9S/coopenomics с правом записи —
      # секрет GITEA_DEPLOY_KEY. Без секрета (запуск в Gitea) — прежний путь.
      # Превью открыто по ссылке, но поисковикам закрыто.
      - name: Close preview from indexing
        if: env.TARGET == 'preview'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt

      - name: Publish static
        env:
          GITEA_DEPLOY_KEY: ${{ secrets.GITEA_DEPLOY_KEY }}
        run: |
          if [ "$TARGET" = preview ]; then PAGES=preview-pages; else PAGES=pages-blago; fi
          cd site
          git init -q
          git config user.name  "docs-actions"
          git config user.email "actions@git.coopenomics.world"
          git add -A
          # mono@<sha> в сообщении — по нему работа plan узнаёт, из чего собрано превью.
          git commit -q -m "docs: сборка ${TARGET} из ${MONO_REF} mono@${MONO_SHA} (${GITHUB_SHA::7})"
          if [ -n "$GITEA_DEPLOY_KEY" ]; then
            install -m 700 -d ~/.ssh
            printf '%s\n' "$GITEA_DEPLOY_KEY" > ~/.ssh/gitea_deploy
            chmod 600 ~/.ssh/gitea_deploy
            ssh-keyscan -p 222 git.coopenomics.world >> ~/.ssh/known_hosts 2>/dev/null
            GIT_SSH_COMMAND="ssh -i ~/.ssh/gitea_deploy -o IdentitiesOnly=yes" \
              git push -q --force ssh://git@git.coopenomics.world:222/C9S/coopenomics.git "HEAD:$PAGES"
          else
            git push -q --force \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@git.coopenomics.world/C9S/coopenomics.git" \
              "HEAD:$PAGES"
          fi

      # Раскатку на узел делает вебхук репозитория: push в pages-blago будит
      # интеграцию Semaphore gitea-blago-docs-deploy (шаблон 96 BLAGO-DOCS,
      # матчер ref contains refs/heads/pages-blago). API Semaphore отсюда не
      # зовём: с 31.08.2026 публичный адрес закрыт и отдаёт 403 всему, кроме
      # /api/integrations/, а прямой вызов ронял сборку месяц подряд.
