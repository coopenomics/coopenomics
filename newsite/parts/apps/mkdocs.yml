    - Учреждение участка:
      - Собрания: ku/member/meetings.md
      - Участие в собрании: ku/member/meeting-join.md
      - Открытие голосования: ku/member/meeting-vote.md
      - Бюллетень участника: ku/member/meeting-ballot.md
      - Протокол и заявление в совет: ku/member/meeting-protocol.md
      - Решение совета: ku/member/meeting-council.md
    - Доверенные лица:
      - Заявка пайщика: ku/member/trusted.md
      - Одобрение председателем участка: ku/branch-chairman/trusted.md

  - Робот совета:
