      - Группа курса: edubridge/admin/group.md
      - Календарь школы: edubridge/admin/calendar.md
      - Площадки: edubridge/admin/platforms.md
      - Преподаватели: edubridge/admin/teachers.md
      - Ученики: edubridge/admin/members.md
      - Взносы преподавателей: edubridge/admin/contributions.md
      - Экономика программы: edubridge/admin/economy.md
      - Выплаты: edubridge/admin/payments.md
    - Стол ученика:
      - edubridge/member/index.md
      - Каталог курсов: edubridge/member/catalog.md
      - Карточка курса: edubridge/member/course.md
